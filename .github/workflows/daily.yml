name: daily report

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run main.go

      - name: commit
        run: |
          git config --local user.email "siddusbakka@gmail.com"
          git config --local user.name "siddubakka"
          git add reports/
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: update report $(date -u +'%Y-%m-%d')"
            git push
          fi
